name: 'build-test'
on:
    pull_request:
    push:
        branches:
            - main
            - 'releases/*'

jobs:
    build:
        name: 'Build'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
            - run: yarn
            - run: yarn all
    test:
        name: 'Test'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - id: version
              uses: ./
            - name: Install dependencies
              if: steps.version.outputs.is-new-version == 'true'
              env:
                  PUBLISHED_VERSION: ${{ steps.version.outputs.published-version }}
                  COMMITTED_VERSION: ${{ steps.version.outputs.committed-version }}
              run: |
                  echo "Latest published verison: $PUBLISHED_VERSION"
                  echo "Repo version: $COMMITTED_VERSION"
